limit_req_zone $binary_remote_addr zone=shebang_api:10m rate=15r/s;
server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 8m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://api:3180;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  location ~ ^/(admin(?:/|$|\.html)|api/v1/(admin(?:/|$)|auth(?:/|$)|sandbox(?:/|$))) { return 404; }
  location ~ /\. { return 404; }
  location /api/v1/ {
    limit_req zone=shebang_api burst=50 nodelay;
    limit_req_status 429;
    proxy_pass $backend;
    expires -1;
  }
  location / { proxy_pass $backend; }
}
