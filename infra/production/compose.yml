name: shebang-prod
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: shebang
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, app_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-shebang.sh:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d shebang"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: 1.0
    shm_size: 128m
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
    image: shebang/app:production
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: "3180"
      DATABASE_URL_FILE: /run/secrets/db_url
      PUBLIC_ORIGIN: http://149.88.67.92:8080
      SEED_REAL_CATALOG: "true"
      ENABLE_PARTNER_MARKET: "false"
    secrets: [db_url]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3180/api/v1/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.5
    networks: [frontend, backend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  frontend:
    name: shebang_prod_frontend
  backend:
    name: shebang_prod_backend
    internal: true
volumes:
  postgres_data:
    name: shebang_prod_postgres
secrets:
  postgres_password:
    file: /opt/shebang-prod/shared/secrets/postgres_password
  app_password:
    file: /opt/shebang-prod/shared/secrets/app_password
  db_url:
    file: /opt/shebang-prod/shared/secrets/db_url
