
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pinjie
      POSTGRES_USER: pinjie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinjie"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis:/data
volumes:
  postgres:
  redis:
